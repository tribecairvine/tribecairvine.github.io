<style>
#tdb-gate{position:fixed;inset:0;background:rgba(74,70,63,.6);backdrop-filter:blur(3px);
z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
#tdb-gate .tb-card{background:#fff;max-width:620px;width:100%;border-radius:12px;
box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
#tdb-gate .tb-cap{padding:20px 26px 14px;border-bottom:3px solid #bfc879}
#tdb-gate .tb-cap img{width:150px;height:auto}
#tdb-gate .tb-body{padding:18px 26px;overflow:auto;color:#433f38;font-size:14px;line-height:1.6}
#tdb-gate h2{margin:.2em 0 .6em;color:#4a463f;font-size:1.15rem}
#tdb-gate .tb-foot{padding:16px 26px 22px;border-top:1px solid #e4e2da;background:#faf9f6}
#tdb-gate label{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#37352f;margin-bottom:14px;cursor:pointer}
#tdb-gate label input{margin-top:3px;width:17px;height:17px;accent-color:#77813a}
#tdb-gate .tb-go{background:#77813a;color:#fff;border:none;border-radius:8px;padding:11px 20px;
font-size:15px;font-weight:600;cursor:pointer;opacity:.45;pointer-events:none}
#tdb-gate .tb-go.on{opacity:1;pointer-events:auto}
#tdb-gate .tb-no{background:none;border:none;color:#8b887f;font-size:13px;margin-left:14px;cursor:pointer;text-decoration:underline}
</style>
<script>
(function(){
  var KEY="tribeca_disclaimer_v1";
  try{ if(localStorage.getItem(KEY)==="1") return; }catch(e){}
  function build(){
    var logo=document.querySelector('.site-logo, .site-header img, .site-title img');
    var src=logo?logo.getAttribute('src')||getComputedStyle(logo).backgroundImage.slice(5,-2):'';
    var g=document.createElement('div'); g.id="tdb-gate";
    g.innerHTML=
      '<div class="tb-card">'+
      (src?'<div class="tb-cap"><img src="'+src+'" alt="Tribeca at Central Park West"></div>':'')+
      '<div class="tb-body"><h2>Before you continue</h2>'+
      '<p>This website is an <b>unofficial, convenience copy</b> of the community\'s governing documents. It is <b>not an official record</b> of the Association, and it is not Association property.</p>'+
      '<p>The documents were scanned and converted by computer (OCR), so they may contain errors. The <b>official recorded CC&amp;Rs, Bylaws, and other governing documents are the only authoritative versions.</b> If anything here differs from the official documents, the official documents control.</p>'+
      '<p>To get official copies, contact management (the custodian of records) through your homeowner portal. Nothing is withheld.</p>'+
      '<p>Provided in good faith, "as is," with no warranty. To the fullest extent permitted by law, the Association, its Board of Directors, its managing agent, and anyone who prepared or maintains this website are not responsible for any error or any loss resulting from use of this information. <b>Use it at your own risk</b> and verify anything important against the official records.</p></div>'+
      '<div class="tb-foot"><label><input type="checkbox" id="tb-ck"><span>I have read and agree.</span></label>'+
      '<button class="tb-go" id="tb-go">Enter the wiki</button>'+
      '<button class="tb-no" id="tb-no">Do not agree</button></div></div>';
    document.body.appendChild(g);
    document.documentElement.style.overflow="hidden";
    var ck=g.querySelector('#tb-ck'), go=g.querySelector('#tb-go');
    ck.addEventListener('change',function(){ go.classList.toggle('on',ck.checked); });
    go.addEventListener('click',function(){ if(!ck.checked)return;
      try{localStorage.setItem(KEY,"1");}catch(e){}
      g.remove(); document.documentElement.style.overflow=""; });
    g.querySelector('#tb-no').addEventListener('click',function(){
      g.querySelector('.tb-body').innerHTML='<h2>You have not agreed</h2><p>You have chosen not to accept the terms. Please close this tab to exit. The official governing documents are available from management through your homeowner portal.</p>';
      g.querySelector('.tb-foot').style.display='none'; });
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>
